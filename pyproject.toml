[project]
name = "apt-daily"
version = "0.1.0"
description = "Daily Nationwide Apartment Trade Data Dashboard with Streamlit and GitHub Actions"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "streamlit>=1.40.0",
    "pandas>=2.2.0",
    "plotly>=5.24.0",
    "httpx>=0.28.0",
    "python-dotenv>=1.0.1",
    "pytest>=8.3.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.pyright]
include = [".", "src", "tests"]
extraPaths = ["."]
executionEnvironments = [
  { root = "." }
]
