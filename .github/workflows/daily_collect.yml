name: Daily APT Trade Data Collection

on:
  schedule:
    # Every day at 21:00 UTC (06:00 KST)
    - cron: '0 21 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

jobs:
  collect-and-update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.11

      - name: Install project dependencies
        run: uv sync

      - name: Collect Apartment Trade Data
        env:
          DATA_GO_KR_API_KEY: ${{ secrets.DATA_GO_KR_API_KEY }}
        run: uv run python -m src.collector --days 7

      - name: Commit and Push Database Changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add data/apt_trade.db
          if git diff --staged --quiet; then
            echo "No database changes detected."
          else
            git commit -m "chore(data): auto-update apt trade records [skip ci]"
            git push
          fi
